name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      # No dependency cache: a release must not restore a store written by other workflows.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - name: Pack
        id: pack
        run: |
          tgz=$(node -p "const p = require('./package.json'); p.name + '-' + p.version + '.tgz'")
          pnpm pack
          tar tzf "$tgz" > contents.txt
          grep -qx 'package/package.json' contents.txt
          grep -q '^package/lib/' contents.txt
          echo "tgz=$tgz" >> "$GITHUB_OUTPUT"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: gh release create "$TAG" "$TGZ" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
